<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何坐标归一化可视化工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: crosshair;
        }
        canvas:hover {
            border-color: #3b82f6;
        }
        .canvas-container {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .point {
            fill: #ef4444;
            stroke: #dc2626;
            stroke-width: 2;
        }
        .point.ref-vertex {
            fill: #22c55e;
            stroke: #16a34a;
        }
        .point.right-neighbor {
            fill: #f59e0b;
            stroke: #d97706;
        }
        .line {
            stroke: #6b7280;
            stroke-width: 2;
            fill: none;
        }
        .status-success {
            color: #16a34a;
            background-color: #dcfce7;
        }
        .status-error {
            color: #dc2626;
            background-color: #fef2f2;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 标题 -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">几何坐标归一化可视化工具</h1>
            <p class="text-gray-600">在左侧画布中绘制奇数个点，查看右侧归一化结果</p>
        </div>

        <!-- 工具栏 -->
        <div class="mb-6 flex justify-center space-x-4">
            <button id="clearBtn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                清除画布
            </button>
            <button id="processBtn" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold" disabled>
                处理坐标
            </button>
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-600">点数:</span>
                <span id="pointCount" class="px-2 py-1 bg-gray-200 rounded text-sm font-mono">0</span>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 左侧：输入画布 -->
            <div class="canvas-container">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">输入画布</h2>
                <p class="text-sm text-gray-600 mb-4">点击画布添加点（需要奇数个点）</p>
                <canvas id="inputCanvas" width="500" height="400" class="w-full"></canvas>
                
                <!-- 坐标显示 -->
                <div class="mt-4">
                    <h3 class="font-medium text-gray-700 mb-2">当前坐标:</h3>
                    <div id="coordinatesList" class="bg-white p-3 rounded border max-h-32 overflow-y-auto text-sm font-mono">
                        暂无坐标点
                    </div>
                </div>
            </div>

            <!-- 右侧：输出画布 -->
            <div class="canvas-container">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">归一化结果</h2>
                <p class="text-sm text-gray-600 mb-4">处理后的极坐标结果</p>
                <canvas id="outputCanvas" width="500" height="400" class="w-full"></canvas>
                
                <!-- 结果显示 -->
                <div class="mt-4">
                    <h3 class="font-medium text-gray-700 mb-2">归一化坐标 (r, θ):</h3>
                    <div id="resultsList" class="bg-white p-3 rounded border max-h-32 overflow-y-auto text-sm font-mono">
                        等待处理...
                    </div>
                </div>
            </div>
        </div>

        <!-- 状态信息 -->
        <div class="mt-6">
            <div id="statusMessage" class="p-4 rounded-lg border hidden">
                <span id="statusText"></span>
            </div>
        </div>

        <!-- 说明文档 -->
        <div class="mt-8 bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">使用说明</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm text-gray-600">
                <div>
                    <h3 class="font-medium text-gray-800 mb-2">操作步骤:</h3>
                    <ol class="list-decimal list-inside space-y-1">
                        <li>在左侧画布中点击添加点（必须为奇数个）</li>
                        <li>点击"处理坐标"按钮</li>
                        <li>查看右侧画布中的归一化结果</li>
                        <li>使用"清除画布"重新开始</li>
                    </ol>
                </div>
                <div>
                    <h3 class="font-medium text-gray-800 mb-2">颜色说明:</h3>
                    <ul class="space-y-1">
                        <li><span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>普通点</li>
                        <li><span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>参考点（中间点）</li>
                        <li><span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>右邻居点</li>
                        <li><span class="inline-block w-4 h-1 bg-gray-500 mr-2"></span>连接线</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/geometry-viz.js"></script>
</body>
</html>
