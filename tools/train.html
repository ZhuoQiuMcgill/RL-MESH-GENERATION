<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>强化学习网格生成训练管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/train.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#6366F1',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 overflow-hidden">
<!-- 主容器 - 使用固定视窗高度 -->
<div class="flex h-screen max-h-screen">
    <!-- 左侧控制面板 - 固定宽度，防止缩放影响 -->
    <div class="w-80 min-w-80 max-w-80 bg-white shadow-lg border-r border-gray-200 flex flex-col">
        <!-- 头部 - 固定高度 -->
        <div class="flex-shrink-0 p-4 border-b border-gray-200">
            <h1 class="text-lg font-bold text-gray-800">训练管理</h1>
            <p class="text-xs text-gray-600 mt-1">强化学习网格生成系统</p>
        </div>

        <!-- 控制区域 - 可滚动 -->
        <div class="flex-1 p-4 overflow-y-auto custom-scrollbar">
            <!-- 状态指示器 -->
            <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-gray-700">训练状态</span>
                    <div id="status-indicator" class="flex items-center">
                        <div class="w-2 h-2 bg-gray-400 rounded-full mr-2"></div>
                        <span id="status-text" class="text-sm text-gray-600">未启动</span>
                    </div>
                </div>
            </div>

            <!-- Mesh选择 -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">选择初始Mesh</label>
                <select id="mesh-select"
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                    <option value="">加载中...</option>
                </select>
                <div id="mesh-info" class="mt-2 text-xs text-gray-500 hidden">
                    <div>顶点数: <span id="mesh-vertices">0</span></div>
                    <div>文件大小: <span id="mesh-size">0</span> bytes</div>
                </div>
            </div>

            <!-- 训练参数 -->
            <div class="mb-4">
                <h3 class="text-sm font-medium text-gray-700 mb-3">训练参数</h3>

                <div class="mb-3">
                    <label class="block text-xs text-gray-600 mb-1">最大Episodes</label>
                    <input id="max-episodes" type="number" value="1000" min="1"
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                </div>

                <div class="mb-3">
                    <label class="block text-xs text-gray-600 mb-1">每Episode最大步数</label>
                    <input id="max-steps" type="number" value="1000" min="1"
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                </div>

                <div class="mb-3">
                    <label class="block text-xs text-gray-600 mb-1">更新间隔 (秒)</label>
                    <input id="update-interval" type="number" value="10" min="1"
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">

                    <!-- 进度条部分 -->
                    <div class="mt-3">
                        <div class="rog-progress-container">
                            <div id="update-progress-bar" class="rog-progress-bar"></div>
                        </div>
                        <div id="update-progress-text" class="rog-progress-text">下次更新倒计时: --</div>
                    </div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="space-y-2">
                <button id="start-btn"
                        class="w-full bg-primary hover:bg-blue-600 text-white font-medium py-2 px-4 text-sm rounded-lg transition-colors duration-200">
                    开始训练
                </button>
                <button id="stop-btn"
                        class="w-full bg-danger hover:bg-red-600 text-white font-medium py-2 px-4 text-sm rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled>
                    停止训练
                </button>
                <button id="refresh-btn"
                        class="w-full bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 text-sm rounded-lg transition-colors duration-200">
                    刷新Mesh列表
                </button>
            </div>
        </div>
    </div>

    <!-- 右侧主要区域 -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- 上方统计信息区域 - 紧凑布局 -->
        <div class="flex-shrink-0 bg-white border-b border-gray-200 p-3">
            <h2 class="text-sm font-semibold text-gray-800 mb-3">训练统计</h2>

            <!-- 主要指标 - 2行2列布局 -->
            <div class="grid grid-cols-4 gap-3 mb-3">
                <div class="text-center">
                    <div class="text-lg font-bold text-blue-600" id="current-episode">0</div>
                    <div class="text-xs text-gray-600">当前Episode</div>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold text-green-600" id="total-steps">0</div>
                    <div class="text-xs text-gray-600">总步数</div>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold text-purple-600" id="avg-reward">0.000</div>
                    <div class="text-xs text-gray-600">平均奖励</div>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold text-orange-600" id="buffer-size">0</div>
                    <div class="text-xs text-gray-600">缓冲区利用率</div>
                </div>
            </div>

            <!-- 详细信息 - 3列布局 -->
            <div class="grid grid-cols-3 gap-2 text-xs">
                <div>
                    <span class="text-gray-600">Episode奖励:</span>
                    <span id="episode-reward" class="font-semibold text-gray-800 ml-1">0.000</span>
                </div>
                <div>
                    <span class="text-gray-600">Episode长度:</span>
                    <span id="episode-length" class="font-semibold text-gray-800 ml-1">0</span>
                </div>
                <div>
                    <span class="text-gray-600">参考点:</span>
                    <span id="ref-point" class="font-semibold text-gray-800 ml-1">N/A</span>
                </div>
                <div>
                    <span class="text-gray-600">点击坐标:</span>
                    <span id="click-coordinates" class="font-semibold text-blue-600 ml-1">未点击</span>
                </div>
                <div>
                    <span class="text-gray-600">显示Episode:</span>
                    <span id="display-episode" class="font-semibold text-gray-800 ml-1">0</span>
                </div>
                <div>
                    <span class="text-gray-600">边界顶点数:</span>
                    <span id="boundary-vertices" class="font-semibold text-gray-800 ml-1">0</span>
                </div>
            </div>
        </div>

        <!-- 网格可视化区域 - 限制高度确保合适的长宽比 -->
        <div class="flex-1 p-3 min-h-0">
            <div class="h-full bg-white rounded-lg shadow-sm border border-gray-200 p-2">
                <canvas id="mesh-canvas" class="w-full h-full border border-gray-300 rounded max-h-full"></canvas>
            </div>
        </div>

        <!-- 底部日志区域 - 固定高度 -->
        <div class="flex-shrink-0 bg-white border-t border-gray-200 p-3 h-24">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium text-gray-700">训练日志</h3>
                <button id="clear-log-btn" class="text-xs text-gray-500 hover:text-gray-700">清除</button>
            </div>
            <div id="log-container" class="h-16 overflow-y-auto bg-gray-50 rounded px-2 py-1 text-xs font-mono custom-scrollbar">
                <div class="text-gray-500">等待训练开始...</div>
            </div>
        </div>
    </div>
</div>

<!-- 加载指示器 -->
<div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-primary"></div>
        <span class="text-gray-700">处理中...</span>
    </div>
</div>

<!-- 引入模块化的JavaScript文件 -->
<script type="module">
    // 导入并初始化训练管理器
    import {TrainingManager} from './js';

    // 当页面加载完成后初始化应用
    document.addEventListener('DOMContentLoaded', () => {
        window.trainingManager = new TrainingManager();

        // 添加调试功能到全局作用域
        window.debugMeshList = () => {
            if (window.trainingManager) {
                window.trainingManager.debugLoadMeshList();
            } else {
                console.error('trainingManager未初始化');
            }
        };

        window.reloadMeshList = () => {
            if (window.trainingManager) {
                window.trainingManager.loadMeshList();
            } else {
                console.error('trainingManager未初始化');
            }
        };

        console.log('调试功能已加载:');
        console.log('- 在控制台运行 debugMeshList() 来调试mesh列表加载');
        console.log('- 在控制台运行 reloadMeshList() 来重新加载mesh列表');
    });
</script>
</body>
</html>
