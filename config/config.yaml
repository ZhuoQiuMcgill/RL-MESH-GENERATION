# 路径配置 - 统一管理所有文件路径
paths:
  # 数据根目录（相对于项目根目录）
  data_root: "data"

  # 网格数据子目录
  mesh_dir: "mesh"

  # 其他数据子目录
  custom_dir: "custom"
  examples_dir: "examples"

  # 结果和输出目录
  results_dir: "results"
  logs_dir: "logs"
  models_dir: "models"

  # 缓存和临时目录
  cache_dir: ".cache"
  temp_dir: ".temp"

  # 工具目录
  tools_dir: "tools"

  # 配置文件目录
  config_dir: "config"

  # 默认的mesh文件名（用于演示）
  default_meshes:
    - "1"

# Stable-Baselines3 SAC配置
# 注意：前端只会修改training.max_timesteps和environment.max_steps
# 其他所有SAC参数都从这里读取，保证训练的一致性
sb3_sac:
  # 学习率 - 控制优化器的步长
  learning_rate: 0.0003

  # 经验回放缓冲区大小 - 存储经验的容量
  buffer_size: 1000000

  # 开始训练前的随机探索步数 - 确保缓冲区有足够的经验
  learning_starts: 10000

  # 训练批次大小 - 每次从缓冲区采样的经验数量
  batch_size: 128

  # 软更新系数 - 目标网络更新的速度
  tau: 0.005

  # 折扣因子 - 未来奖励的重要性
  gamma: 0.99

  # 训练频率 - 每多少环境步进行一次训练
  train_freq: 1

  # 梯度更新步数 - 每次训练时进行多少次梯度更新
  gradient_steps: 1

  # 神经网络架构 - 隐藏层的神经元数量
  net_arch: [ 128, 128, 128 ]

  # 随机种子 - 保证实验可重现性
  seed: 356

  # 详细输出级别 - 0:无输出, 1:基本信息, 2:详细信息
  verbose: 0

# 环境配置
environment:
  # 邻居顶点数量 - 参考顶点左右各取n个邻居
  n: 2

  # 扇形区域观察点数量 - 在扇形区域内选择g个观察点
  g: 3

  # 动作空间半径因子 - 控制新顶点生成的范围
  alpha: 2

  # 状态观察半径因子 - 控制状态观察的范围
  beta: 6

  # 每episode最大步数 - 前端可以修改此参数
  # 如果前端没有提供，则使用此默认值
  max_steps: 1000

  # 密度奖励相关参数
  upsilon: 1.0
  kappa: 4.0

  # 最大内角阈值（度）
  M_angle: 60.0

# 训练配置
training:
  # 最大训练步数 - 前端可以修改此参数
  # 如果前端没有提供，则使用此默认值
  max_timesteps: 1000000

  # 每episode最大步数 - 与environment.max_steps保持一致
  # 这里保留是为了向后兼容
  max_steps_per_episode: 1000

  # 模型保存和日志频率 - 基于timestep
  save_frequency: 10000           # 每多少个timestep保存一次检查点
  log_frequency: 1000             # 每多少个timestep输出一次日志
  evaluation_frequency: 5000      # 每多少个timestep进行一次评估

  # 训练历史保存频率
  history_save_frequency: 10000   # 每多少个timestep保存一次episode历史数据

  # 早停和收敛参数（暂未实现）
  early_stopping_patience: 200    # 早停的patience
  convergence_threshold: 0.01     # 收敛阈值