# 路径配置 - 统一管理所有文件路径
paths:
  # 数据根目录（相对于项目根目录）
  data_root: "data"

  # 网格数据子目录
  mesh_dir: "mesh"

  # 其他数据子目录
  custom_dir: "custom"
  examples_dir: "examples"

  # 默认的mesh文件名（用于演示）
  default_meshes:
    - "basic1"

# Stable-Baselines3 SAC配置
# 注意：前端只会修改training.max_timesteps和environment.max_steps
# 其他所有SAC参数都从这里读取，保证训练的一致性
sb3_sac:
  # 学习率 - 控制优化器的步长
  learning_rate: 0.0003

  # 经验回放缓冲区大小 - 存储经验的容量
  buffer_size: 100000

  # 开始训练前的随机探索步数 - 确保缓冲区有足够的经验
  learning_starts: 2000

  # 训练批次大小 - 每次从缓冲区采样的经验数量
  batch_size: 256

  # 软更新系数 - 目标网络更新的速度
  tau: 0.005

  # 折扣因子 - 未来奖励的重要性
  gamma: 0.5

  # 训练频率 - 每多少环境步进行一次训练
  train_freq: 1

  # 梯度更新步数 - 每次训练时进行多少次梯度更新
  gradient_steps: 1

  # 神经网络架构 - 隐藏层的神经元数量
  net_arch: [ 128, 128, 128 ]

  # 随机种子 - 保证实验可重现性
  seed: 999

  # 详细输出级别 - 0:无输出, 1:基本信息, 2:详细信息
  verbose: 0

  ent_coef: 0.2

# 环境配置
environment:
  # 邻居顶点数量 - 参考顶点左右各取n个邻居
  n: 2

  # 扇形区域观察点数量 - 在扇形区域内选择g个观察点
  g: 3

  # 动作空间半径因子 - 控制新顶点生成的范围
  alpha: 2

  # 状态观察半径因子 - 控制状态观察的范围
  beta: 6

  # 每episode最大步数 - 前端可以修改此参数
  # 如果前端没有提供，则使用此默认值
  max_steps: 1000

  # 密度奖励相关参数
  upsilon: 1.0
  kappa: 4.0

  # 最大内角阈值（度）
  M_angle: 60.0

  # 动作配置 - 控制训练中可用的动作类型
  actions:
    # 启用的动作类型列表
    # 可选值: "type0_left", "type0_right", "type1", "type2"
    enabled: [ "type0_left", "type0_right", "type1" ]
    
    # 动作类型映射配置
    # 当启用的动作类型少于4个时，会重新映射action_type值
    # auto_remap: true时自动重新映射，false时保持原始映射
    auto_remap: false
    
    # 动作描述（用于日志和调试）
    descriptions:
      type0_left: "Type 0 Left - Connect left boundary vertices to form quadrilateral"
      type0_right: "Type 0 Right - Connect right boundary vertices to form quadrilateral"
      type1: "Type 1 - Add one new vertex to form quadrilateral"

# 训练配置
training:
  # 最大训练步数 - 前端可以修改此参数
  # 如果前端没有提供，则使用此默认值
  max_timesteps: 1000000

  # 每episode最大步数 - 与environment.max_steps保持一致
  max_steps_per_episode: 1000

  # Auto evaluation configuration
  evaluation_frequency: 1      # Every how many episodes to perform evaluation
  evaluation_starts: 550       # From which episode to start evaluation (0 means start from the beginning)
  n_eval_episodes: 1         # How many episodes to run per evaluation
  
  # 最佳模型保存条件配置
  require_completed_for_save: false   # 是否要求evaluation中必须有completed的episode才能保存最佳模型
  
  # 日志配置
  enable_verbose_logging: false  # 是否启用详细的训练日志（包括评估过程日志）
