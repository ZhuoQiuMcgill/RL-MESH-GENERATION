# 路径配置 - 统一管理所有文件路径
paths:
  # 数据根目录（相对于项目根目录）
  data_root: "data"

  # 网格数据子目录
  mesh_dir: "mesh"

  # 其他数据子目录
  custom_dir: "custom"
  examples_dir: "examples"

  # 结果和输出目录
  results_dir: "results"
  logs_dir: "logs"
  models_dir: "models"

  # 缓存和临时目录
  cache_dir: ".cache"
  temp_dir: ".temp"

  # 工具目录
  tools_dir: "tools"

  # 配置文件目录
  config_dir: "config"

  # 默认的mesh文件名（用于演示）
  default_meshes:
    - "1"


# SAC算法选择配置
sac_backend:
  # 选择SAC实现方式: "custom" 或 "sb3"
  # - "custom": 使用自制的SAC实现
  # - "sb3": 使用stable_baselines3的SAC实现
  type: "sb3"

# 自制SAC配置 (当sac_backend.type为"custom"时使用)
sac_agent:
  actor_lr: 0.0003
  critic_lr: 0.00010
  alpha_lr: 0.0003
  weight_decay: 0.00001
  gamma: 0.99
  tau: 0.005
  hidden_dim: 128
  buffer_size: 800000
  batch_size: 128
  start_training_steps: 5000

# Stable-Baselines3 SAC配置 (当sac_backend.type为"sb3"时使用)
sb3_sac:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 100
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  net_arch: [128, 128, 128]  # 网络架构，对应论文中的最佳配置S2
  seed: null
  verbose: 0

# 经验回放缓冲区配置
replay_buffer:
  # 缓冲区类型: "normal", "prioritized", 或 "off"
  # - "normal": 标准经验回放缓冲区
  # - "prioritized": 优先级经验回放缓冲区(PER)
  # - "off": 关闭经验回放，使用在线学习
  # 注意: SB3模式下此配置将被忽略，因为SB3有自己的缓冲区管理
  type: "prioritized"
  capacity: 1000000

  # 优先级经验回放(PER)参数 - 仅当type为"prioritized"时使用
  prioritized:
    alpha: 0.65          # 优先级指数，控制优先级的强度 (0=uniform, 1=full prioritization)
    beta_start: 0.4     # 重要性采样权重的初始值
    beta_frames: 100000 # beta从beta_start增长到1.0所需的帧数
    epsilon: 0.000001   # 小常数，防止优先级为0

environment:
  n: 2
  g: 3
  alpha: 2
  beta: 6
  max_steps: 1000
  upsilon: 1.0
  kappa: 4.0
  M_angle: 60.0

training:
  # 训练基本参数 - 基于timestep
  max_timesteps: 1000000          # 最大训练步数
  max_steps_per_episode: 1000     # 每episode最大步数

  # 保存和日志参数 - 基于timestep
  save_frequency: 10000           # 每多少个timestep保存一次检查点
  log_frequency: 1000             # 每多少个timestep输出一次日志
  evaluation_frequency: 5000      # 每多少个timestep进行一次评估

  # 训练历史保存频率 - 新增配置
  history_save_frequency: 10000   # 每多少个timestep保存一次episode历史数据

  # 早停和收敛参数
  early_stopping_patience: 200    # 早停的patience（暂未实现）
  convergence_threshold: 0.01     # 收敛阈值（暂未实现）