<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Action Tester Frontend</title>
</head>
<body>
    <h1>Test Action Tester Frontend</h1>
    
    <h2>Test Mesh List API</h2>
    <button onclick="testMeshList()">Test Mesh List</button>
    <div id="mesh-list-result"></div>
    
    <h2>Test Reference Point API</h2>
    <button onclick="testRefPoint()">Test Reference Point (mesh: 1)</button>
    <div id="ref-point-result"></div>
    
    <script>
        async function testMeshList() {
            try {
                const response = await fetch('http://localhost:5000/mesh/list');
                const data = await response.json();
                document.getElementById('mesh-list-result').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('mesh-list-result').innerHTML = 
                    '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
        
        async function testRefPoint() {
            try {
                const response = await fetch('http://localhost:5000/action/find-ref-point/1');
                const data = await response.json();
                document.getElementById('ref-point-result').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('ref-point-result').innerHTML = 
                    '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
